<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schedule Bus Trip</title>
</head>
<body>
<h1>Schedule a New Bus Trip</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/trips}" th:object="${trip}" method="post">
    <input type="hidden" name="repository" th:value="${selectedRepository}">
    <div>
        <label for="id">Trip ID:</label><br>
        <input type="text" id="id" th:field="*{id}" required />
    </div>
    <br>
    <div>
        <label for="routeId">Route ID:</label><br>
        <input type="text" id="routeId" th:field="*{routeId}" required />
    </div>
    <br>
    <div>
        <label for="busId">Bus ID:</label><br>
        <input type="text" id="busId" th:field="*{busId}" required />
    </div>
    <br>
    <div>
        <label for="startTime">Start Time:</label><br>
        <input type="datetime-local" id="startTime" th:field="*{startTime}" required />
    </div>
    <br>
    <div>
        <label for="arrivalTime">Arrival Time:</label><br>
        <input type="datetime-local" id="arrivalTime" th:field="*{arrivalTime}" required />
    </div>
    <br>
    <div>
        <label for="status">Status:</label><br>
        <select id="status" th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>
        </select>
    </div>
    <br>
    <button type="submit">Save Bus Trip</button>
    <a th:href="@{/trips(repository=${selectedRepository})}">Cancel</a>
</form>
</body>
</html>
