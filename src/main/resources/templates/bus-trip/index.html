<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Trip List</title>
</head>
<body>
<h1>Bus Trip Overview</h1>

<p>
    <a th:href="@{/trips/new}">Add New Trip</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Route ID</th>
        <th>Bus ID</th>
        <th>Start Time</th>
        <th>Arrival Time</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="trip : ${trips}">
        <td th:text="${trip.id}">TR-01</td>
        <td th:text="${trip.routeId}">R-10</td>
        <td th:text="${trip.busId}">B-01</td>
        <td th:text="${#temporals.format(trip.startTime, 'yyyy-MM-dd HH:mm')}">2026-11-07 10:00</td>
        <td th:text="${#temporals.format(trip.arrivalTime, 'yyyy-MM-dd HH:mm')}">2026-11-07 12:30</td>
        <td th:text="${trip.status}">SCHEDULED</td>
        <td>
            <form th:action="@{'/trips/' + ${trip.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
