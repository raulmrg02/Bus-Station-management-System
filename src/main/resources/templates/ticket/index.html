<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket List</title>
</head>
<body>
<h1>Ticket Overview</h1>

<form th:action="@{/tickets}" method="get">
    <label for="repository">Data source:</label>
    <select id="repository" name="repository" onchange="this.form.submit()">
        <option value="IN_MEMORY" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.TicketService.RepositoryType).IN_MEMORY}">
            In-memory repository
        </option>
        <option value="IN_FILE" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.TicketService.RepositoryType).IN_FILE}">
            In-file repository
        </option>
    </select>
</form>

<p>
    <a th:href="@{/tickets/new(repository=${selectedRepository})}">Book New Ticket</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Trip</th>
        <th>Passenger</th>
        <th>Seat</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.id}">T1</td>
        <td th:text="${ticket.tripId}">TRIP-1</td>
        <td th:text="${ticket.passengerId}">P1</td>
        <td th:text="${ticket.seatNumber}">12A</td>
        <td th:text="${ticket.price}">25.00</td>
        <td>
            <form th:action="@{'/tickets/' + ${ticket.id} + '/delete'}" method="post">
                <input type="hidden" name="repository" th:value="${selectedRepository}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
