<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff List</title>
</head>
<body>
<h1>Staff Overview</h1>

<form th:action="@{/staff}" method="get">
    <label for="repository">Data source:</label>
    <select id="repository" name="repository" onchange="this.form.submit()">
        <option value="IN_MEMORY" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.StaffService.RepositoryType).IN_MEMORY}">
            In-memory repository
        </option>
        <option value="IN_FILE" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.StaffService.RepositoryType).IN_FILE}">
            In-file repository
        </option>
    </select>
</form>

<p>
    <a th:href="@{/staff/new(repository=${selectedRepository})}">Add New Staff Member</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Details</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="staff : ${staffList}">
        <td th:text="${staff.id}">S1</td>
        <td th:text="${staff.name}">Alice</td>
        <td th:text="${staff.class.simpleName}">Driver</td>
        <td>
            <span th:if="${staff.class.simpleName == 'Driver'}"
                  th:text="${'Experience: ' + staff.yearsOfExperience + ' years'}"></span>
            <span th:if="${staff.class.simpleName == 'TripManager'}"
                  th:text="${'Employee Code: ' + staff.employeeCode}"></span>
        </td>
        <td>
            <form th:action="@{'/staff/' + ${staff.id} + '/delete'}" method="post">
                <input type="hidden" name="repository" th:value="${selectedRepository}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
