<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Bus Station</title>
</head>
<body>
<h1>Add a New Bus Station</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/stations}" th:object="${station}" method="post">
    <input type="hidden" name="repository" th:value="${selectedRepository}">
    <div>
        <label for="id">Station ID:</label><br>
        <input type="text" id="id" th:field="*{id}" required />
    </div>
    <br>
    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br>
    <div>
        <label for="city">City:</label><br>
        <input type="text" id="city" th:field="*{city}" required />
    </div>
    <br>
    <button type="submit">Save Bus Station</button>
    <a th:href="@{/stations(repository=${selectedRepository})}">Cancel</a>
</form>
</body>
</html>
