<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isUpdate} ? 'Update Bus Station' : 'Create Bus Station'">Create Bus Station</title>
</head>
<body>
<h1 th:text="${isUpdate} ? 'Update Bus Station' : 'Add a New Bus Station'">Add a New Bus Station</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="${isUpdate} ? @{/stations/{id}(id=${station.id})} : @{/stations}" th:object="${station}" method="post">
    <div>
        <label for="id">Station ID:</label><br>
        <input type="text" id="id" th:field="*{id}" readonly required />
    </div>
    <br>
    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br>
    <div>
        <label for="city">City:</label><br>
        <input type="text" id="city" th:field="*{city}" required />
    </div>
    <br>
    <button type="submit" th:text="${isUpdate} ? 'Update Bus Station' : 'Save Bus Station'">Save Bus Station</button>
    <a th:href="@{/stations}">Cancel</a>
</form>
</body>
</html>
