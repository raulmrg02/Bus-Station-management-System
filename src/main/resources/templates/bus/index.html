<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus List</title>
</head>
<body>
<h1>Bus Overview</h1>

<form th:action="@{/buses}" method="get">
    <label for="repository">Data source:</label>
    <select id="repository" name="repository" onchange="this.form.submit()">
        <option value="IN_MEMORY" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.BusService.RepositoryType).IN_MEMORY}">
            In-memory repository
        </option>
        <option value="IN_FILE" th:selected="${selectedRepository == T(com.example.busstationmanagementsystem.service.BusService.RepositoryType).IN_FILE}">
            In-file repository
        </option>
    </select>
</form>

<p>
    <a th:href="@{/buses/new(repository=${selectedRepository})}">Add New Bus</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Registration Number</th>
        <th>Capacity</th>
        <th>Model</th>
        <th>Manufacture Year</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bus : ${busList}">
        <td th:text="${bus.id}">B1</td>
        <td th:text="${bus.registrationNumber}">B-TX 1001</td>
        <td th:text="${bus.capacity}">45</td>
        <td th:text="${bus.model}">Mercedes-Benz Citaro</td>
        <td th:text="${bus.manufactureYear}">2020</td>
        <td th:text="${bus.status}">ACTIVE</td>
        <td>
            <form th:action="@{'/buses/' + ${bus.id} + '/delete'}" method="post">
                <input type="hidden" name="repository" th:value="${selectedRepository}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
