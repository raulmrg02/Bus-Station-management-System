<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Bus</title>
</head>
<body>
<h1>Add a New Bus</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/buses}" th:object="${bus}" method="post">
    <input type="hidden" name="repository" th:value="${selectedRepository}">
    <div>
        <label for="id">Bus ID:</label><br>
        <input type="text" id="id" th:field="*{id}" required />
    </div>
    <br>
    <div>
        <label for="registrationNumber">Registration Number:</label><br>
        <input type="text" id="registrationNumber" th:field="*{registrationNumber}" required />
    </div>
    <br>
    <div>
        <label for="capacity">Capacity:</label><br>
        <input type="number" id="capacity" th:field="*{capacity}" min="0" required />
    </div>
    <br>
    <div>
        <label for="model">Model:</label><br>
        <input type="text" id="model" th:field="*{model}" required />
    </div>
    <br>
    <div>
        <label for="manufactureYear">Manufacture Year:</label><br>
        <input type="number" id="manufactureYear" th:field="*{manufactureYear}" min="0" required />
    </div>
    <br>
    <div>
        <label for="status">Status:</label><br>
        <select id="status" th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>
        </select>
    </div>
    <br>
    <button type="submit">Save Bus</button>
    <a th:href="@{/buses(repository=${selectedRepository})}">Cancel</a>
</form>
</body>
</html>
